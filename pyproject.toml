[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skeet-tracker"
version = "0.1.0"
description = "ISSF International Skeet performance tracking and analytics engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
skeet = "skeet_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skeet_tracker = ["schema.sql"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
